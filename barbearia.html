<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barbearia Romana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <header>
        <h1 class="text-center fw-bold">Barbearia Bravo</h1>
        <img src="logo.jpg" alt="Logo Barbearia" style="width: 80px;">

        <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand">Busca</a>
            <form class="d-flex" role="search">
            <input class="form-control me-2" type="search" placeholder="Pesquisar" aria-label="Search"/>
            <button class="btn btn-outline-success" type="submit">Buscar</button>
            </form>
        </div>
        </nav>

    </header>
    <main class="text-center">
        <section class="py-5">
            <div class="container text-center">
              <h1 class="fw-bold">Sobre nós</h1>
              <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                  <p class="fw-bold text-center">A barbearia com o melhor atendimento e serviço da região ! Desde 2019 mudando pessoas</p>
                </div>
              </div>
            </div>
        </section>

        <section class="py-5">
          <div class="container">

            <h1 class="fw-bold text-center mb-4">Serviços</h1>
            <div class="row g-4 justify-content-center">
              <div class="col-sm-6 col-md-4 col-lg-3">

                <div class="card h-100">
                  <img src="corte.jpg" class="card-img-top" alt="Corte de Cabelo">
                  <div class="card-body text-center">
                    <h5 class="card-title">Corte de Cabelo</h5>
                    <p class="card-text"></p>
                  </div>
                </div>
              </div>

              <div class="col-sm-6 col-md-4 col-lg-3">
                <div class="card h-100">
                  <img src="cabelo.jpg" class="card-img-top" alt="Coloração de cabelo">
                  <div class="card-body text-center">
                    <h5 class="card-title">Coloração de cabelo</h5>
                    <p class="card-text"></p>
                  </div>
                </div>
              </div>

              <div class="col-sm-6 col-md-4 col-lg-3">
                <div class="card h-100">
                  <img src="hidratacao.jpg" class="card-img-top" alt="Hidratação">
                  <div class="card-body text-center">
                    <h5 class="card-title">Hidratação</h5>
                    <p class="card-text"></p>
                  </div>
                </div>
              </div>

              <div class="col-sm-6 col-md-4 col-lg-3">
                <div class="card h-100">
                  <img src="depilacao_nasal.jpg" class="card-img-top" alt="Depilação nasal">
                  <div class="card-body text-center">
                    <h5 class="card-title">Depilação nasal</h5>
                    <p class="card-text"></p>
                  </div>
                </div>
              </div>

            </div> 
          </div>
        </section>

        <section>
            <h1 class="fw-bold">Depoimentos</h1>
  
        </section>
        <div class="row justify-content-center">
          <div class="col-11 col-md-6">
            <div id="carouselExampleSlidesOnly" class="carousel slide" data-bs-ride="carousel">
              <div class="carousel-inner">
                <div class="carousel-item active">
                  <img src="download.jpg" class="d-block img-fluid mx-auto rounded shadow-sm" alt="Depoimento Cliente">
                </div>
                <div class="carousel-item">
                  <img src="image_cC6VWI.png" class="d-block img-fluid mx-auto rounded shadow-sm" alt="Depoimento Cliente 2">
                </div>
              </div>
            </div>
          </div>
        </div>

        <section>
            <h1 class="fw-bold">Contato</h1>

            <div class="mb-3">
              <label for="exampleFormControlInput1" class="form-label">Nome</label>
              <input type="nome" class="form-control" id="exampleFormControlInput1">
            </div>

            <div class="mb-3">
              <label for="exampleFormControlInput1" class="form-label">Email</label>
              <input type="email" class="form-control" id="exampleFormControlInput1">
            </div>

            <div class="mb-3">
              <label for="exampleFormControlTextarea1" class="form-label">Deixe uma mensagem</label>
              <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
            </div>

            <button class="btn btn-outline-success" type="submit">Enviar</button>
        </section>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
